[project]
name = "jevi"
version = "0.1.0"
description = "Mini Jev-protocol clone: POST /v1/systemone with choice/noul/score, format enforced by pydantic-ai"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-ai-slim>=2.0",
  "httpx>=0.27",
  "transformers>=4.55",
  "accelerate",
  "huggingface_hub",
  "torch",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["."]
